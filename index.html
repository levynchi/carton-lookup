<style>
  :root {
    --bg: #f3f4f6; --card: #ffffff; --text: #111827; --muted: #6b7280; --line: #e5e7eb;
    --arye: #1d4ed8; --arye-bg: #dbeafe; --arye-dark: #1e3a8a;
    --baby: #be185d; --baby-bg: #fce7f3; --baby-dark: #831843;
    --warn: #b45309; --warn-bg: #fef3c7;
    --ok: #047857; --ok-bg: #d1fae5; --used: #4b5563; --used-bg: #e5e7eb;
    --danger: #b91c1c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, "Heebo", Arial, sans-serif; }
  body { min-height: 100vh; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  header { background: #1f2937; color: #fff; padding: 8px 14px 7px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  header .ttl h1 { margin: 0; font-size: 15px; font-weight: 700; }
  header .ttl p { margin: 2px 0 0; font-size: 11px; color: #d1d5db; }
  header .tools { display: flex; gap: 6px; }
  header button { background: #374151; color: #fff; border: none; border-radius: 10px; width: 38px; height: 38px; font-size: 18px; cursor: pointer; }
  header a.navlink { background: #374151; color: #fff; text-decoration: none; border-radius: 10px; padding: 8px 10px; font-size: 13px; font-weight: 800; }
  header button.alert { background: var(--warn); }
  main { max-width: 520px; margin: 0 auto; padding: 8px 12px 16px; }

  .sync { font-size: 12px; text-align: center; margin: 0 0 6px; color: var(--muted); min-height: 16px; }
  .sync.err { color: var(--danger); font-weight: 700; }
  .sync.pending { color: var(--warn); font-weight: 700; }

  .seg { display: flex; border: 2px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--card); margin-bottom: 8px; }
  .seg button { flex: 1; border: none; background: transparent; padding: 10px 6px; font-size: 15px; font-weight: 800; color: var(--muted); cursor: pointer; }
  .seg button.on { background: #1f2937; color: #fff; }
  .seg button small { display: block; font-size: 11px; font-weight: 600; opacity: .8; }

  .search { position: relative; }
  .search input {
    width: 100%; font-size: 32px; font-weight: 800; text-align: center; letter-spacing: 2px;
    padding: 8px 48px; border: 2px solid var(--line); border-radius: 14px;
    background: var(--card); color: var(--text); outline: none; direction: ltr;
    -webkit-appearance: none; appearance: none;
  }
  .search input:focus { border-color: #9ca3af; }
  .search input::placeholder { color: #d1d5db; font-weight: 600; letter-spacing: 0; font-size: 22px; }
  .search button {
    position: absolute; top: 50%; right: 12px; transform: translateY(-50%);
    width: 40px; height: 40px; border-radius: 50%; border: none; background: var(--line);
    color: var(--muted); font-size: 22px; line-height: 1; cursor: pointer; display: none;
  }
  .search.has-value button { display: block; }
  .hint { text-align: center; color: var(--muted); font-size: 12px; margin: 6px 0 0; }
  body.has-result .hint { display: none; }

  .card { margin-top: 8px; border-radius: 16px; padding: 10px 12px 12px; background: var(--card);
    border: 2px solid var(--line); box-shadow: 0 6px 20px rgba(0,0,0,.06); display: none; }
  .card.show { display: block; animation: pop .18s ease-out; }
  @keyframes pop { from { transform: scale(.97); opacity: .4; } to { transform: scale(1); opacity: 1; } }
  .card.arye { background: var(--arye-bg); border-color: var(--arye); }
  .card.baby { background: var(--baby-bg); border-color: var(--baby); }
  .card.is-used { background: var(--used-bg); border-color: #9ca3af; }
  .card.missing { background: var(--warn-bg); border-color: var(--warn); text-align: center; }
  .card.missing .big { font-size: 22px; font-weight: 700; color: var(--warn); }
  .card.missing .sub { color: var(--muted); margin-top: 6px; font-size: 14px; }

  .size-hero { background: rgba(255,255,255,.85); border-radius: 14px; padding: 6px 10px 8px; text-align: center; position: relative; }
  .size-hero .lbl { font-size: 13px; color: var(--muted); font-weight: 700; }
  .size-hero .val { font-size: 64px; font-weight: 900; line-height: .95; margin-top: 0; direction: ltr; letter-spacing: 1px; }
  .is-used .size-hero .val { color: var(--used); text-decoration: line-through; text-decoration-thickness: 4px; text-decoration-color: var(--danger); }
  .who { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-top: 8px; }
  .brand { font-size: 26px; font-weight: 900; line-height: 1; }
  .arye .brand { color: var(--arye-dark); }
  .baby .brand { color: var(--baby-dark); }
  .carton-no { font-size: 15px; color: var(--muted); font-weight: 700; }
  .carton-no b { color: var(--text); }
  .model-name { margin-top: 4px; font-size: 18px; font-weight: 800; line-height: 1.2; }
  .tag { display: inline-block; margin-inline-start: 6px; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: rgba(255,255,255,.85); border: 1px solid var(--line); color: var(--muted); vertical-align: middle; }
  .tag.loc { background: #fff7ed; border-color: #fdba74; color: #9a3412; }

  .status { margin-top: 10px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .status .pill { font-size: 14px; font-weight: 800; padding: 6px 12px; border-radius: 999px; }
  .pill.closed { background: var(--ok-bg); color: var(--ok); }
  .pill.used { background: #fff; color: var(--used); border: 1px solid #9ca3af; }
  .pill.baby { background: #fff; color: var(--baby-dark); border: 1px solid var(--baby); }
  .status .when { font-size: 12px; color: var(--muted); }
  .act { margin-top: 10px; width: 100%; border: none; border-radius: 14px; padding: 14px; font-size: 18px; font-weight: 900; cursor: pointer; color: #fff; }
  .act.open { background: var(--danger); }
  .act.undo { background: var(--used); }
  .act:active { transform: scale(.98); }
  .act[disabled] { opacity: .6; }

  .summary { margin-top: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .summary .box { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 8px 10px; text-align: center; }
  .summary .box .n { font-size: 22px; font-weight: 900; }
  .summary .box .l { font-size: 11px; color: var(--muted); font-weight: 700; }
  .summary .box.closed .n { color: var(--ok); }
  .summary .box.used .n { color: var(--used); }
  body.keyboard details, body.keyboard footer, body.keyboard .summary { display: none; }

  details { margin-top: 14px; background: var(--card); border-radius: 16px; border: 1px solid var(--line); }
  summary { cursor: pointer; padding: 14px 16px; font-weight: 700; font-size: 15px; list-style: none; display: flex; justify-content: space-between; align-items: center; }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: "▾"; color: var(--muted); transition: transform .15s; }
  details[open] summary::after { transform: rotate(180deg); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 9px 8px; text-align: right; border-top: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; font-size: 12px; background: #fafafa; }
  td.num { direction: ltr; text-align: right; font-variant-numeric: tabular-nums; }
  tr.arye td:first-child { border-right: 4px solid var(--arye); }
  tr.baby td:first-child { border-right: 4px solid var(--baby); }
  tr.clickable { cursor: pointer; }
  tr.clickable:active { background: #f3f4f6; }
  .brand-head td { background: #f9fafb; font-weight: 800; font-size: 14px; }
  .brand-head.arye td { color: var(--arye-dark); }
  .brand-head.baby td { color: var(--baby-dark); }
  td .left { color: var(--ok); font-weight: 700; }
  td .gone { color: var(--used); }
  .recent li { display: flex; justify-content: space-between; padding: 8px 14px; border-top: 1px solid var(--line); font-size: 14px; }
  .recent li b { direction: ltr; }
  .recent li span { color: var(--muted); font-size: 12px; }
  .recent ul { list-style: none; margin: 0; padding: 0 0 6px; }
  .empty { padding: 10px 14px; color: var(--muted); font-size: 13px; }
  footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 24px; }

  dialog { border: none; border-radius: 16px; padding: 0; max-width: 92vw; width: 420px; }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  .dlg { padding: 14px 16px 16px; }
  .dlg h2 { margin: 0 0 8px; font-size: 17px; }
  .dlg p { margin: 6px 0; font-size: 13px; color: var(--muted); }
  .dlg input { width: 100%; font-size: 15px; padding: 10px; border: 2px solid var(--line); border-radius: 10px; direction: ltr; }
  .dlg .row { display: flex; gap: 8px; margin-top: 10px; }
  .dlg .row button { flex: 1; border: none; border-radius: 10px; padding: 11px; font-weight: 800; font-size: 14px; cursor: pointer; }
  .dlg .save { background: #1f2937; color: #fff; }
  .dlg .test { background: var(--arye-bg); color: var(--arye-dark); }
  .dlg .close { background: var(--line); color: var(--text); }
  .dlg .msg { margin-top: 8px; font-size: 13px; min-height: 18px; }
  .dlg .msg.ok { color: var(--ok); }
  .dlg .msg.err { color: var(--danger); }
</style>
</head>
<body>
<header>
  <div class="ttl">
    <h1>קרטונים של עומר</h1>
    <p id="meta"></p>
  </div>
  <div class="tools">
    <a class="navlink" href="intake.html">תעודה</a>
    <button id="refresh" type="button" aria-label="רענן">↻</button>
    <button id="settings" type="button" aria-label="הגדרות">⚙</button>
  </div>
</header>
<main>
  <p class="sync" id="sync"></p>

  <div class="seg" id="seg"></div>

  <div class="search" id="search">
    <input id="q" type="text" inputmode="numeric" pattern="[0-9Xx ]*" placeholder="הקלד מספר קרטון" autofocus autocomplete="off" aria-label="מספר קרטון">
    <button id="clear" type="button" aria-label="נקה">×</button>
  </div>
  <p class="hint" id="hint"></p>

  <section class="card" id="card" aria-live="polite"></section>

  <div class="summary" id="summary"></div>

  <details class="recent" id="recent">
    <summary>נפתחו לאחרונה</summary>
    <ul id="recent-list"></ul>
  </details>

  <details id="ranges">
    <summary>טבלת טווחים - איזה קרטונים שייכים למי</summary>
    <table>
      <thead><tr><th>קרטונים</th><th>דגם</th><th>מידה</th><th>סגורים</th></tr></thead>
      <tbody id="ranges-body"></tbody>
    </table>
  </details>

  <footer id="footer"></footer>
</main>

<dialog id="dlg">
  <div class="dlg">
    <h2>הגדרות סנכרון</h2>
    <p>טוקן GitHub (fine-grained) עם הרשאת Contents: Read/Write לרפו <span id="repo-name" style="direction:ltr;display:inline-block"></span>. נשמר רק בטלפון הזה.</p>
    <input id="token" type="password" placeholder="github_pat_..." autocomplete="off">
    <div class="row">
      <button class="save" id="tok-save" type="button">שמור</button>
      <button class="test" id="tok-test" type="button">בדוק חיבור</button>
      <button class="close" id="tok-close" type="button">סגור</button>
    </div>
    <p class="msg" id="tok-msg"></p>
    <p id="pending-info"></p>
  </div>
</dialog>

<script>
(function () {
  var DATA = JSON.parse(document.getElementById('data').textContent);
  var API = 'https://api.github.com/repos/' + DATA.repo + '/contents/' + DATA.usedFile;
  var LS = { token: 'omer_gh_token', used: 'omer_used_cache', pending: 'omer_pending', ship: 'omer_shipment' };

  var byKey = {}, byShip = {};
  DATA.shipments.forEach(function (s) { byShip[s.id] = s; });
  DATA.cartons.forEach(function (c) { byKey[c.key] = c; });
  var gallery1 = {};
  DATA.gallery1.forEach(function (k) { gallery1[k] = true; });

  var state = {
    used: {}, sha: null, pending: [], token: '',
    ship: DATA.defaultShipment, current: null, online: navigator.onLine, syncing: false, lastErr: ''
  };
  try { state.token = localStorage.getItem(LS.token) || ''; } catch (e) {}
  try { state.pending = JSON.parse(localStorage.getItem(LS.pending) || '[]') || []; } catch (e) { state.pending = []; }
  try { var cu = JSON.parse(localStorage.getItem(LS.used) || 'null'); if (cu && cu.used) { state.used = cu.used; state.sha = cu.sha || null; } } catch (e) {}
  try { var ss = localStorage.getItem(LS.ship); if (ss && byShip[ss]) state.ship = ss; } catch (e) {}

  // ---------- helpers
  function brandClass(b) { return b === 'ARYE' ? 'arye' : 'baby'; }
  function brandLabel(b) { return DATA.brands[b] || b; }
  function modelCode(m) { return String(m).padStart(3, '0'); }
  function modelName(m) { return DATA.models[String(m)] || ''; }
  function labelOf(c) { return c.n + byShip[c.sh].suffix; }
  function isUsed(key) { return !!state.used[key]; }
  function effectiveUsed() {
    // used map + pending changes not yet pushed
    var m = {}; for (var k in state.used) m[k] = state.used[k];
    state.pending.forEach(function (p) { if (p.used) m[p.key] = { at: p.at, by: 'phone', pending: true }; else delete m[p.key]; });
    return m;
  }
  function fmtWhen(s) { return s ? String(s).replace(/^(\d{4})-(\d{2})-(\d{2}) /, '$3.$2.$1 ') : ''; }
  function nowStr() {
    var d = new Date(), p = function (n) { return String(n).padStart(2, '0'); };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function savePending() { try { localStorage.setItem(LS.pending, JSON.stringify(state.pending)); } catch (e) {} }
  function saveUsedCache() { try { localStorage.setItem(LS.used, JSON.stringify({ used: state.used, sha: state.sha, at: nowStr() })); } catch (e) {} }
  function b64utf8(str) { return btoa(unescape(encodeURIComponent(str))); }
  function b64decode(str) { return decodeURIComponent(escape(atob(String(str).replace(/\n/g, '')))); }
  function headers() {
    var h = { 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
    if (state.token) h['Authorization'] = 'Bearer ' + state.token;
    return h;
  }

  // ---------- GitHub sync
  function apiGet() {
    return fetch(API + '?ref=' + DATA.branch + '&t=' + Date.now(), { headers: headers(), cache: 'no-store' }).then(function (r) {
      if (r.status === 404) return { used: {}, sha: null };
      if (!r.ok) throw new Error('GitHub ' + r.status);
      return r.json().then(function (b) {
        var obj = {};
        try { obj = JSON.parse(b64decode(b.content || '') || '{}'); } catch (e) { obj = {}; }
        return { used: (obj && obj.used) || {}, sha: b.sha || null };
      });
    });
  }
  function apiPut(usedMap, sha, message) {
    var keys = Object.keys(usedMap).sort(function (a, b) { return (parseInt(a, 10) || 0) - (parseInt(b, 10) || 0) || (a < b ? -1 : 1); });
    var sorted = {}; keys.forEach(function (k) { sorted[k] = usedMap[k]; });
    var body = { message: message, content: b64utf8(JSON.stringify({ used: sorted }, null, 1)), branch: DATA.branch };
    if (sha) body.sha = sha;
    return fetch(API, { method: 'PUT', headers: headers(), body: JSON.stringify(body) }).then(function (r) {
      if (r.status === 409 || r.status === 422) { var e = new Error('conflict'); e.conflict = true; throw e; }
      if (!r.ok) throw new Error('GitHub ' + r.status);
      return r.json().then(function (b) { return { used: sorted, sha: (b.content && b.content.sha) || null }; });
    });
  }
  function setSync(text, cls) {
    var el = document.getElementById('sync');
    el.textContent = text || ''; el.className = 'sync' + (cls ? ' ' + cls : '');
    document.getElementById('settings').className = (state.pending.length || (!state.token && state.pending.length)) ? 'alert' : '';
  }
  function refreshStatusLine() {
    if (state.syncing) { setSync('מסנכרן…'); return; }
    if (state.pending.length) {
      setSync(state.pending.length + ' סימונים ממתינים לסנכרון' + (!state.token ? ' — חסר טוקן (⚙)' : state.lastErr ? ' — ' + state.lastErr : ''), 'pending');
      return;
    }
    if (state.lastErr) { setSync('לא מקוון — מציג נתונים שמורים (' + state.lastErr + ')', 'err'); return; }
    var n = Object.keys(state.used).length;
    setSync('מסונכרן · ' + n + ' קרטונים נפתחו');
  }
  function flush() {
    if (state.syncing) return Promise.resolve();
    if (!state.pending.length) return Promise.resolve();
    if (!state.token) { refreshStatusLine(); return Promise.resolve(); }
    state.syncing = true; refreshStatusLine();
    var attempt = 0;
    function go() {
      attempt++;
      return apiGet().then(function (remote) {
        var merged = {}; for (var k in remote.used) merged[k] = remote.used[k];
        var pend = state.pending.slice();
        pend.forEach(function (p) { if (p.used) merged[p.key] = { at: p.at, by: 'phone' }; else delete merged[p.key]; });
        var msg = pend.length === 1 ? ((pend[0].used ? 'Open' : 'Unopen') + ' carton ' + pend[0].key + ' (phone)') : ('Sync ' + pend.length + ' carton marks (phone)');
        return apiPut(merged, remote.sha, msg).then(function (res) {
          state.used = res.used; state.sha = res.sha;
          state.pending = state.pending.filter(function (p) { return pend.indexOf(p) === -1; });
          savePending(); saveUsedCache(); state.lastErr = '';
        });
      }).catch(function (e) {
        if (e && e.conflict && attempt < 3) return go();
        state.lastErr = (e && e.message) || 'שגיאה';
      });
    }
    return go().then(function () { state.syncing = false; refreshStatusLine(); renderAll(); });
  }
  function loadRemote() {
    state.syncing = true; refreshStatusLine();
    return apiGet().then(function (remote) {
      state.used = remote.used; state.sha = remote.sha; state.lastErr = ''; saveUsedCache();
    }).catch(function (e) {
      state.lastErr = (e && e.message) || 'אין חיבור';
    }).then(function () { state.syncing = false; refreshStatusLine(); renderAll(); return flush(); });
  }

  // ---------- marking
  function toggle(key, used) {
    var now = nowStr();
    // drop any earlier pending change for the same key
    state.pending = state.pending.filter(function (p) { return p.key !== key; });
    var remoteHas = !!state.used[key];
    if (used !== remoteHas) state.pending.push({ key: key, used: used, at: now });
    savePending(); renderAll(); refreshStatusLine();
    if (navigator.vibrate) { try { navigator.vibrate(used ? 40 : 15); } catch (e) {} }
    flush();
  }

  // ---------- rendering
  var input = document.getElementById('q');
  var search = document.getElementById('search');
  var card = document.getElementById('card');
  var hint = document.getElementById('hint');
  var debounceTimer = null;
  var DEBOUNCE_MS = 550;

  function renderMeta() {
    var parts = DATA.shipments.map(function (s) { return s.short + ' ' + s.count; });
    document.getElementById('meta').textContent = parts.join(' · ') + ' קרטונים · עודכן ' + DATA.updated;
    document.getElementById('footer').textContent = 'מקור: ' + DATA.shipments.map(function (s) { return s.source; }).join(' | ');
    document.getElementById('repo-name').textContent = DATA.repo;
    hint.textContent = 'אחרי ההקלדה השדה מתנקה — אפשר להקליד מספר חדש';
  }
  function renderSeg() {
    var seg = document.getElementById('seg'); seg.innerHTML = '';
    DATA.shipments.forEach(function (s) {
      var b = document.createElement('button'); b.type = 'button';
      b.innerHTML = s.label + '<small>' + s.min + s.suffix + '–' + s.max + s.suffix + '</small>';
      b.className = s.id === state.ship ? 'on' : '';
      b.addEventListener('click', function () { setShip(s.id); input.focus(); });
      seg.appendChild(b);
    });
  }
  function setShip(id) {
    if (!byShip[id]) return;
    state.ship = id; try { localStorage.setItem(LS.ship, id); } catch (e) {}
    renderSeg(); renderSummary(); renderRanges();
  }
  function showCard(key) {
    var c = byKey[key];
    state.current = key;
    if (!c) {
      var s = byShip[state.ship];
      card.className = 'card missing show';
      card.innerHTML = '<div class="big">קרטון ' + key + ' לא נמצא</div>' +
        '<div class="sub">במשלוח ' + s.label + ' יש קרטונים ' + s.min + s.suffix + ' עד ' + s.max + s.suffix + ' בלבד</div>';
      document.body.classList.add('has-result');
      return;
    }
    var eff = effectiveUsed();
    var used = eff[key];
    var cls = brandClass(c.brand) + (used ? ' is-used' : '');
    var tags = '<span class="tag">דגם ' + modelCode(c.model) + '</span><span class="tag">' + byShip[c.sh].short + '</span>';
    if (c.brand === 'ARYE' && c.loc) tags += '<span class="tag loc">' + c.loc + '</span>';
    var statusHtml, actHtml = '';
    if (c.brand !== 'ARYE') {
      statusHtml = '<span class="pill baby">נמסר לבייבי בייסיק</span><span class="when">' + c.pieces + ' יח׳ · ' + c.packets + ' חבילות</span>';
    } else if (used) {
      statusHtml = '<span class="pill used">נפתח' + (used.pending ? ' (ממתין)' : '') + '</span><span class="when">' + fmtWhen(used.at) + '</span>';
      actHtml = '<button class="act undo" type="button" data-key="' + key + '" data-used="0">בטל סימון — הקרטון עדיין סגור</button>';
    } else {
      statusHtml = '<span class="pill closed">סגור — במלאי</span><span class="when">' + c.pieces + ' יח׳ · ' + c.packets + ' חבילות</span>';
      actHtml = '<button class="act open" type="button" data-key="' + key + '" data-used="1">סמן כנפתח</button>';
    }
    card.className = 'card ' + cls + ' show';
    card.innerHTML =
      '<div class="size-hero"><div class="lbl">מידה</div><div class="val">' + c.size + '</div></div>' +
      '<div class="who"><div class="brand">' + brandLabel(c.brand) + '</div>' +
        '<div class="carton-no">קרטון <b>' + labelOf(c) + '</b></div></div>' +
      '<div class="model-name">' + modelName(c.model) + tags + '</div>' +
      '<div class="status">' + statusHtml + '</div>' + actHtml;
    document.body.classList.add('has-result');
    keepSizeVisible();
  }
  card.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-key]');
    if (!b) return;
    var key = b.getAttribute('data-key'), used = b.getAttribute('data-used') === '1';
    if (!used && !confirm('לבטל את הסימון של קרטון ' + key + '?')) return;
    b.disabled = true;
    toggle(key, used);
  });
  function renderSummary() {
    var eff = effectiveUsed();
    var arye = DATA.cartons.filter(function (c) { return c.brand === 'ARYE' && c.sh === state.ship; });
    var closed = arye.filter(function (c) { return !eff[c.key]; });
    var pieces = closed.reduce(function (a, c) { return a + c.pieces; }, 0);
    var g1 = closed.filter(function (c) { return c.loc === DATA.gallery1Location; }).length;
    document.getElementById('summary').innerHTML =
      '<div class="box closed"><div class="n">' + closed.length + '</div><div class="l">קרטוני אריה סגורים · ' + pieces.toLocaleString() + ' יח׳</div></div>' +
      '<div class="box used"><div class="n">' + (arye.length - closed.length) + '</div><div class="l">נפתחו מתוך ' + arye.length + '</div></div>' +
      '<div class="box"><div class="n">' + g1 + '</div><div class="l">סגורים ב' + DATA.gallery1Location + '</div></div>' +
      '<div class="box"><div class="n">' + (closed.length - g1) + '</div><div class="l">סגורים ב' + DATA.defaultLocation + '</div></div>';
  }
  function renderRecent() {
    var eff = effectiveUsed();
    var items = Object.keys(eff).map(function (k) { return { key: k, at: eff[k].at || '', pending: !!eff[k].pending }; });
    items.sort(function (a, b) { return a.at < b.at ? 1 : a.at > b.at ? -1 : 0; });
    var ul = document.getElementById('recent-list');
    if (!items.length) { ul.innerHTML = '<li class="empty">עדיין לא סומנו קרטונים</li>'; return; }
    ul.innerHTML = items.slice(0, 40).map(function (it) {
      var c = byKey[it.key];
      var desc = c ? (modelName(c.model) + ' ' + c.size + ' · ' + byShip[c.sh].short) : '';
      return '<li data-key="' + it.key + '"><b>' + it.key + '</b><span>' + desc + '</span><span>' + fmtWhen(it.at) + (it.pending ? ' ⏳' : '') + '</span></li>';
    }).join('');
  }
  document.getElementById('recent-list').addEventListener('click', function (e) {
    var li = e.target.closest('li[data-key]'); if (!li) return;
    var key = li.getAttribute('data-key'); var c = byKey[key]; if (c) setShip(c.sh);
    showCard(key); window.scrollTo({ top: 0, behavior: 'smooth' });
  });
  function renderRanges() {
    var eff = effectiveUsed();
    var body = document.getElementById('ranges-body');
    var s = byShip[state.ship];
    var lastBrand = null, html = '';
    (DATA.ranges[state.ship] || []).forEach(function (r) {
      var cls = brandClass(r.brand);
      if (r.brand !== lastBrand) {
        html += '<tr class="brand-head ' + cls + '"><td colspan="4">' + brandLabel(r.brand) + '</td></tr>';
        lastBrand = r.brand;
      }
      var span = r.from === r.to ? (r.from + s.suffix) : (r.from + s.suffix + '–' + r.to + s.suffix);
      var left = r.brand === 'ARYE' ? r.keys.filter(function (k) { return !eff[k]; }).length : null;
      var leftHtml = left === null ? '<span class="gone">נמסר</span>' : (left === r.cartons ? '<span class="left">' + left + '</span>' : '<span class="left">' + left + '</span><span class="gone">/' + r.cartons + '</span>');
      html += '<tr class="clickable ' + cls + '" data-key="' + r.keys[0] + '">' +
        '<td class="num">' + span + '</td>' +
        '<td>' + modelCode(r.model) + ' ' + modelName(r.model) + '</td>' +
        '<td class="num">' + r.size + '</td>' +
        '<td class="num">' + leftHtml + '</td></tr>';
    });
    body.innerHTML = html;
  }
  document.getElementById('ranges-body').addEventListener('click', function (e) {
    var tr = e.target.closest('tr[data-key]'); if (!tr) return;
    showCard(tr.getAttribute('data-key'));
    clearTimeout(debounceTimer); clearInputKeepCard();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
  function renderAll() {
    renderSummary(); renderRecent(); renderRanges();
    if (state.current) showCard(state.current);
  }

  // ---------- input
  function parseInput(raw) {
    var s = String(raw || '').toUpperCase();
    var digits = s.replace(/\D/g, '');
    if (!digits) return null;
    var hasX = s.indexOf('X') !== -1;
    return { n: parseInt(digits, 10), hasX: hasX };
  }
  function keyFor(p) {
    if (p.hasX) {
      var xs = DATA.shipments.filter(function (s) { return s.suffix === 'X'; })[0];
      if (xs && xs.id !== state.ship) setShip(xs.id);
      return p.n + 'X';
    }
    return p.n + byShip[state.ship].suffix;
  }
  function syncClearBtn() { search.classList.toggle('has-value', input.value.trim().length > 0); }
  function clearInputKeepCard() { input.value = ''; syncClearBtn(); input.focus(); }
  function scheduleClear() { clearTimeout(debounceTimer); debounceTimer = setTimeout(clearInputKeepCard, DEBOUNCE_MS); }
  function onType() {
    syncClearBtn();
    var p = parseInput(input.value);
    if (!p) return;
    showCard(keyFor(p));
    scheduleClear();
  }
  input.addEventListener('input', onType);
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      var p = parseInput(input.value);
      if (p) showCard(keyFor(p));
      clearTimeout(debounceTimer); clearInputKeepCard();
    }
  });
  document.getElementById('clear').addEventListener('click', function () { clearTimeout(debounceTimer); clearInputKeepCard(); });
  document.getElementById('refresh').addEventListener('click', function () { loadRemote(); });

  // ---------- settings dialog
  var dlg = document.getElementById('dlg');
  var tokIn = document.getElementById('token');
  var tokMsg = document.getElementById('tok-msg');
  function openDlg() {
    tokIn.value = state.token; tokMsg.textContent = ''; tokMsg.className = 'msg';
    document.getElementById('pending-info').textContent = state.pending.length ? ('ממתינים לסנכרון: ' + state.pending.map(function (p) { return p.key + (p.used ? '' : ' (ביטול)'); }).join(', ')) : '';
    if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', '');
  }
  function closeDlg() { if (dlg.close) dlg.close(); else dlg.removeAttribute('open'); input.focus(); }
  document.getElementById('settings').addEventListener('click', openDlg);
  document.getElementById('tok-close').addEventListener('click', closeDlg);
  document.getElementById('tok-save').addEventListener('click', function () {
    state.token = tokIn.value.trim();
    try { if (state.token) localStorage.setItem(LS.token, state.token); else localStorage.removeItem(LS.token); } catch (e) {}
    tokMsg.textContent = state.token ? 'נשמר. מסנכרן…' : 'הטוקן נמחק'; tokMsg.className = 'msg ok';
    loadRemote().then(function () { tokMsg.textContent = state.lastErr ? ('שגיאה: ' + state.lastErr) : 'מסונכרן'; tokMsg.className = 'msg ' + (state.lastErr ? 'err' : 'ok'); });
  });
  document.getElementById('tok-test').addEventListener('click', function () {
    var t = tokIn.value.trim();
    tokMsg.textContent = 'בודק…'; tokMsg.className = 'msg';
    var h = { 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
    if (t) h['Authorization'] = 'Bearer ' + t;
    fetch('https://api.github.com/repos/' + DATA.repo, { headers: h, cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error('GitHub ' + r.status);
      return r.json();
    }).then(function (b) {
      var canWrite = b.permissions && (b.permissions.push || b.permissions.admin);
      tokMsg.textContent = canWrite ? 'החיבור תקין — יש הרשאת כתיבה' : (t ? 'מחובר, אבל אין הרשאת כתיבה לרפו' : 'קריאה בלבד (אין טוקן)');
      tokMsg.className = 'msg ' + (canWrite ? 'ok' : 'err');
    }).catch(function (e) { tokMsg.textContent = 'שגיאה: ' + e.message; tokMsg.className = 'msg err'; });
  });

  // ---------- viewport / keyboard
  function keepSizeVisible() {
    var hero = card.querySelector('.size-hero') || card;
    if (!card.classList.contains('show')) return;
    var vv = window.visualViewport;
    var visibleBottom = (vv ? vv.offsetTop + vv.height : window.innerHeight) - 8;
    var rect = hero.getBoundingClientRect();
    if (rect.bottom > visibleBottom) window.scrollBy(0, rect.bottom - visibleBottom);
  }
  function onViewport() {
    var vv = window.visualViewport;
    var keyboard = vv && (window.innerHeight - vv.height) > 80;
    document.body.classList.toggle('keyboard', !!keyboard);
    keepSizeVisible();
  }
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', onViewport);
    window.visualViewport.addEventListener('scroll', onViewport);
  }
  window.addEventListener('online', function () { state.lastErr = ''; loadRemote(); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) loadRemote(); });

  // ---------- boot
  renderMeta(); renderSeg(); renderAll(); refreshStatusLine();
  var m = location.search.match(/[?&]c=([0-9]+X?)/i);
  if (m) { var k = m[1].toUpperCase(); var cc = byKey[k]; if (cc) setShip(cc.sh); showCard(k); }
  loadRemote();
})();
</script>
</body>
</html>
