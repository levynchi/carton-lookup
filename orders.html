<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>הזמנות</title>
<meta name="theme-color" content="#1f2937">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="הזמנות">

<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%231f2937'/%3E%3Cpath d='M16 18h32v30H16z' fill='none' stroke='%23fbbf24' stroke-width='4' stroke-linejoin='round'/%3E%3Cpath d='M23 28h18M23 36h12' stroke='%23fbbf24' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root { --bg:#f3f4f6; --card:#fff; --text:#111827; --muted:#6b7280; --line:#e5e7eb;
    --ok:#047857; --ok-bg:#d1fae5; --danger:#b91c1c; --warn:#b45309; --warn-bg:#fef3c7;
    --open:#1d4ed8; --open-bg:#dbeafe; --closed:#4b5563; --closed-bg:#e5e7eb; --accent:#1f2937; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,"Segoe UI",Roboto,"Heebo",Arial,sans-serif; }
  body { min-height:100vh; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  header { background:var(--accent); color:#fff; padding:8px 14px 7px; display:flex; align-items:center; justify-content:space-between; gap:8px; position:sticky; top:0; z-index:5; }
  header .ttl h1 { margin:0; font-size:15px; font-weight:700; }
  header .ttl p { margin:2px 0 0; font-size:11px; color:#d1d5db; }
  header .tools { display:flex; gap:6px; align-items:center; }
  header a.navlink, header button { background:#374151; color:#fff; border:none; border-radius:10px; height:36px; padding:0 10px; font-size:13px; font-weight:800; text-decoration:none; display:inline-flex; align-items:center; cursor:pointer; }
  header button.icon { width:38px; justify-content:center; font-size:18px; padding:0; }
  header button.alert { background:var(--warn); }
  main { max-width:560px; margin:0 auto; padding:8px 12px 90px; }
  .sync { font-size:12px; text-align:center; margin:0 0 6px; color:var(--muted); min-height:16px; }
  .sync.err { color:var(--danger); font-weight:700; }
  .sync.pending { color:var(--warn); font-weight:700; }
  .hidden { display:none !important; }

  .chips { display:flex; gap:6px; margin-bottom:8px; }
  .chips button { flex:1; border:2px solid var(--line); background:var(--card); border-radius:12px; padding:9px 4px; font-size:14px; font-weight:800; color:var(--muted); cursor:pointer; }
  .chips button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .chips button small { display:block; font-size:11px; font-weight:600; opacity:.8; }
  input.search { width:100%; font-size:16px; padding:10px 12px; border:2px solid var(--line); border-radius:12px; background:var(--card); margin-bottom:8px; }

  .card { background:var(--card); border:2px solid var(--line); border-radius:16px; padding:10px 12px; margin-bottom:8px; box-shadow:0 4px 14px rgba(0,0,0,.04); }
  .card.tap { cursor:pointer; }
  .card.tap:active { transform:scale(.99); }
  .card.closed { background:#f9fafb; border-color:#d1d5db; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .num { font-size:17px; font-weight:900; direction:ltr; }
  .cust { font-size:18px; font-weight:800; margin-top:2px; }
  .meta { font-size:12px; color:var(--muted); margin-top:3px; }
  .badge { font-size:12px; font-weight:800; padding:3px 10px; border-radius:999px; }
  .badge.open { background:var(--open-bg); color:var(--open); }
  .badge.closed { background:var(--closed-bg); color:var(--closed); }
  .badge.pend { background:var(--warn-bg); color:var(--warn); }
  .bar { height:8px; background:var(--line); border-radius:999px; overflow:hidden; margin-top:8px; }
  .bar i { display:block; height:100%; background:var(--ok); width:0; transition:width .2s; }
  .bar.full i { background:var(--ok); }
  .prog { font-size:12px; color:var(--muted); margin-top:4px; display:flex; justify-content:space-between; }
  .empty { text-align:center; color:var(--muted); padding:30px 10px; font-size:14px; }

  .back { background:none; border:none; color:var(--open); font-size:15px; font-weight:800; padding:6px 0; cursor:pointer; }
  .ohead { background:var(--card); border:2px solid var(--line); border-radius:16px; padding:10px 12px; margin-bottom:8px; }
  .ohead textarea { width:100%; margin-top:8px; border:2px solid var(--line); border-radius:10px; padding:8px; font-size:14px; min-height:40px; resize:vertical; font-family:inherit; }
  .acts { display:flex; gap:8px; margin-top:8px; }
  .acts button { flex:1; border:none; border-radius:12px; padding:12px; font-size:15px; font-weight:900; cursor:pointer; color:#fff; }
  .acts .close-btn { background:var(--closed); }
  .acts .reopen-btn { background:var(--open); }
  .acts .all-btn { background:var(--ok); }
  .acts .del-btn { background:var(--danger); }
  .acts button:disabled { opacity:.5; }

  .group { background:var(--card); border:2px solid var(--line); border-radius:16px; margin-bottom:8px; overflow:hidden; }
  .group h3 { margin:0; padding:9px 12px; font-size:15px; background:#f9fafb; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; }
  .group h3 span { color:var(--muted); font-weight:600; font-size:12px; }
  .line { display:grid; grid-template-columns:46px 1fr auto; gap:8px; align-items:center; padding:8px 10px; border-top:1px solid var(--line); }
  .line:first-of-type { border-top:none; }
  .line.done { background:var(--ok-bg); }
  .line.done .sz, .line.done .sub { text-decoration:line-through; color:var(--muted); }
  .chk { width:40px; height:40px; border-radius:12px; border:2px solid #9ca3af; background:#fff; font-size:22px; color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .line.done .chk { background:var(--ok); border-color:var(--ok); }
  .sz { font-size:22px; font-weight:900; direction:ltr; text-align:right; line-height:1; }
  .sub { font-size:12px; color:var(--muted); margin-top:2px; }
  .qty { display:flex; align-items:center; gap:4px; }
  .qty input { width:52px; font-size:18px; font-weight:800; text-align:center; padding:6px 2px; border:2px solid var(--line); border-radius:10px; }
  .qty select { font-size:12px; padding:6px 4px; border:2px solid var(--line); border-radius:10px; background:#fff; max-width:84px; }
  .qty .units { font-size:11px; color:var(--muted); min-width:40px; text-align:center; }
  .qty .x { border:none; background:none; color:var(--danger); font-size:20px; padding:0 4px; cursor:pointer; }

  .addline { width:100%; border:2px dashed #9ca3af; background:var(--card); color:var(--text); border-radius:14px; padding:12px; font-size:15px; font-weight:800; cursor:pointer; margin-bottom:8px; }

  label.f { display:block; font-size:12px; color:var(--muted); font-weight:700; margin:8px 0 3px; }
  .form input, .form select { width:100%; font-size:16px; padding:9px 10px; border:2px solid var(--line); border-radius:10px; background:#fff; color:var(--text); }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  .sizes { display:flex; flex-wrap:wrap; gap:6px; margin-top:4px; }
  .sizes button { border:2px solid var(--line); background:#fff; border-radius:10px; padding:8px 12px; font-size:15px; font-weight:800; direction:ltr; cursor:pointer; min-width:52px; }
  .sizes button.on { background:var(--open); color:#fff; border-color:var(--open); }
  .primary { width:100%; border:none; border-radius:14px; padding:14px; font-size:17px; font-weight:900; color:#fff; background:var(--ok); cursor:pointer; margin-top:10px; }
  .primary.dark { background:var(--accent); }
  .primary:disabled { opacity:.5; }
  .status { min-height:18px; font-size:13px; color:var(--muted); margin:6px 2px; }
  .status.err { color:var(--danger); font-weight:700; }
  .status.ok { color:var(--ok); font-weight:700; }

  .fab { position:fixed; bottom:calc(16px + env(safe-area-inset-bottom)); left:16px; background:var(--open); color:#fff; border:none; border-radius:999px; height:54px; padding:0 20px 0 16px; font-size:16px; font-weight:900; box-shadow:0 8px 24px rgba(29,78,216,.35); cursor:pointer; display:flex; align-items:center; gap:6px; z-index:4; }
  .fab b { font-size:24px; line-height:1; }

  dialog { border:none; border-radius:16px; padding:0; width:min(460px, 94vw); max-height:92vh; }
  dialog::backdrop { background:rgba(0,0,0,.45); }
  .dlg { padding:14px 16px 16px; }
  .dlg h2 { margin:0 0 8px; font-size:17px; }
  .dlg p { color:var(--muted); font-size:13px; margin:6px 0; }
  .dlg .row2 { display:flex; gap:8px; margin-top:10px; }
  .dlg .row2 button { flex:1; border:none; border-radius:10px; padding:11px; font-weight:800; font-size:14px; cursor:pointer; }
  .dlg .save { background:var(--accent); color:#fff; }
  .dlg .test { background:var(--open-bg); color:var(--open); }
  .dlg .cancel { background:var(--line); color:var(--text); }
  .dlg input[type=password] { width:100%; font-size:15px; padding:10px; border:2px solid var(--line); border-radius:10px; direction:ltr; }
</style>
</head>
<body>
<header>
  <div class="ttl">
    <h1>הזמנות</h1>
    <p id="meta"></p>
  </div>
  <div class="tools">
    <a class="navlink" href="index.html">קרטונים</a>
    <a class="navlink" href="intake.html">תעודה</a>
    <button class="icon" id="refresh" type="button" aria-label="רענן">↻</button>
    <button class="icon" id="settings" type="button" aria-label="הגדרות">⚙</button>
  </div>
</header>
<main>
  <p class="sync" id="sync"></p>

  <!-- list -->
  <section id="v-list">
    <div class="chips" id="chips"></div>
    <input class="search" id="q" type="search" placeholder="חיפוש לקוח / מספר הזמנה" autocomplete="off">
    <div id="list"></div>
  </section>

  <!-- order -->
  <section id="v-order" class="hidden">
    <button class="back" id="back1" type="button">‹ כל ההזמנות</button>
    <div class="ohead" id="ohead"></div>
    <div id="groups"></div>
    <button class="addline" id="addline" type="button">+ הוסף שורה להזמנה</button>
    <div class="acts" id="oacts"></div>
  </section>

  <!-- new -->
  <section id="v-new" class="hidden">
    <button class="back" id="back2" type="button">‹ ביטול</button>
    <div class="card form">
      <label class="f" for="n-cust">לקוח</label>
      <select id="n-cust"></select>
      <div class="grid2">
        <div><label class="f" for="n-date">תאריך</label><input id="n-date" type="date"></div>
        <div><label class="f" for="n-num">מספר הזמנה</label><input id="n-num" type="text" dir="ltr"></div>
      </div>
      <label class="f" for="n-notes">הערות</label>
      <input id="n-notes" type="text" autocomplete="off">
    </div>
    <div id="n-groups"></div>
    <button class="addline" id="n-addline" type="button">+ הוסף שורה</button>
    <p class="status" id="n-status"></p>
    <button class="primary" id="n-save" type="button">שמור הזמנה</button>
  </section>
</main>

<button class="fab" id="fab" type="button"><b>+</b> הזמנה חדשה</button>

<!-- line builder -->
<dialog id="ldlg">
  <div class="dlg form">
    <h2>הוספת שורות</h2>
    <label class="f" for="l-prod">מוצר</label>
    <select id="l-prod"></select>
    <label class="f">מידות (אפשר כמה)</label>
    <div class="sizes" id="l-sizes"></div>
    <div class="grid2">
      <div><label class="f" for="l-type">סוג בד</label><select id="l-type"></select></div>
      <div><label class="f" for="l-color">צבע</label><select id="l-color"></select></div>
    </div>
    <div class="grid2">
      <div><label class="f" for="l-qty">כמות (חבילות)</label><input id="l-qty" type="number" inputmode="numeric" min="1" value="1"></div>
      <div><label class="f" for="l-pack">אריזה</label><select id="l-pack"></select></div>
    </div>
    <p class="status" id="l-status"></p>
    <div class="row2">
      <button class="save" id="l-add" type="button">הוסף</button>
      <button class="cancel" id="l-cancel" type="button">סגור</button>
    </div>
  </div>
</dialog>

<!-- settings -->
<dialog id="sdlg">
  <div class="dlg">
    <h2>הגדרות סנכרון</h2>
    <p>טוקן GitHub (אותו טוקן של דף הקרטונים) עם הרשאת Contents: Read/Write לרפו <span id="repo-name" dir="ltr"></span>. נשמר רק בטלפון הזה.</p>
    <input id="token" type="password" placeholder="github_pat_..." autocomplete="off">
    <div class="row2">
      <button class="save" id="tok-save" type="button">שמור</button>
      <button class="test" id="tok-test" type="button">בדוק</button>
      <button class="cancel" id="tok-close" type="button">סגור</button>
    </div>
    <p class="status" id="tok-msg"></p>
    <p id="pending-info"></p>
  </div>
</dialog>

<script>
(function () {
  var DATA = JSON.parse(document.getElementById('data').textContent);

  function clone(o) { return JSON.parse(JSON.stringify(o)); }

    // remote orders with local pending edits applied

    Object.keys(state.pending).forEach(function (id) {
      var p = state.pending[id], r = map[id];
      if (!r || String(p.updated_at) >= String(r.updated_at)) map[id] = p;

  }
  function findOrder(id) { return effective().filter(function (o) { return o.id === id; })[0] || null; }

      if (!r.ok) throw new Error('GitHub ' + r.status);

        var obj = {};

    var body = { message: message, content: b64utf8(JSON.stringify(payload, null, 1)), branch: DATA.branch };
    if (sha) body.sha = sha;
    return fetch(API, { method: 'PUT', headers: headers(), body: JSON.stringify(body) }).then(function (r) {

  function setSync(text, cls) {

  function refreshStatusLine() {
    if (state.syncing) { setSync('מסנכרן…'); return; }

    if (qty <= 0) { st.textContent = 'כמות חייבת להיות גדולה מאפס'; st.className = 'status err'; return; }
    var lines = picked.map(function (s) {
      return normItem({ product: name, size: s, fabric_type: document.getElementById('l-type').value, fabric_color: document.getElementById('l-color').value, quantity: qty, packaging: pack, done: false });
    });
    if (state.builderTarget === 'new') { if (!state.draft) state.draft = newDraft(); addLines(state.draft, lines); renderNew(); }
    else { var o = findOrder(state.current); if (!o) return; addLines(o, lines); touch(o); }
    st.textContent = 'נוספו ' + lines.length + ' שורות'; st.className = 'status ok';
    picked = []; fillBuilderFor(name);
  });

  // ---------- settings
  var sdlg = document.getElementById('sdlg');
  var tokIn = document.getElementById('token'), tokMsg = document.getElementById('tok-msg');
  document.getElementById('settings').addEventListener('click', function () {
    tokIn.value = state.token; tokMsg.textContent = ''; tokMsg.className = 'status';
    var ids = Object.keys(state.pending);
    document.getElementById('pending-info').textContent = ids.length ? ('ממתינים לסנכרון: ' + ids.map(function (id) { var o = state.pending[id]; return o.order_number || id; }).join(', ')) : '';
    if (sdlg.showModal) sdlg.showModal(); else sdlg.setAttribute('open', '');
  });
  document.getElementById('tok-close').addEventListener('click', function () { if (sdlg.close) sdlg.close(); else sdlg.removeAttribute('open'); });
  document.getElementById('tok-save').addEventListener('click', function () {
    state.token = tokIn.value.trim();
    try { if (state.token) localStorage.setItem(LS.token, state.token); else localStorage.removeItem(LS.token); } catch (e) {}
    tokMsg.textContent = state.token ? 'נשמר. מסנכרן…' : 'הטוקן נמחק'; tokMsg.className = 'status ok';
    loadRemote().then(function () { tokMsg.textContent = state.lastErr ? ('שגיאה: ' + state.lastErr) : 'מסונכרן'; tokMsg.className = 'status ' + (state.lastErr ? 'err' : 'ok'); });
  });
  document.getElementById('tok-test').addEventListener('click', function () {
    var t = tokIn.value.trim();
    tokMsg.textContent = 'בודק…'; tokMsg.className = 'status';
    var h = { 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
    if (t) h['Authorization'] = 'Bearer ' + t;
    fetch('https://api.github.com/repos/' + DATA.repo, { headers: h, cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error('GitHub ' + r.status);
      return r.json();
    }).then(function (b) {
      var canWrite = b.permissions && (b.permissions.push || b.permissions.admin);
      tokMsg.textContent = canWrite ? 'החיבור תקין — יש הרשאת כתיבה' : (t ? 'מחובר, אבל אין הרשאת כתיבה לרפו' : 'קריאה בלבד (אין טוקן)');
      tokMsg.className = 'status ' + (canWrite ? 'ok' : 'err');
    }).catch(function (e) { tokMsg.textContent = 'שגיאה: ' + e.message; tokMsg.className = 'status err'; });
  });

  // ---------- boot
  window.addEventListener('online', function () { state.lastErr = ''; loadRemote(); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) loadRemote(); });
  show('list'); render(); refreshStatusLine();
  var m = location.search.match(/[?&]o=(\d+)/);
  if (m && findOrder(parseInt(m[1], 10))) { state.current = parseInt(m[1], 10); show('order'); render(); }
  loadRemote();
})();
</script>
</body>
</html>
