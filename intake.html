<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>תעודת קליטה</title>
<meta name="theme-color" content="#1f2937">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f2937'/%3E%3Cpath d='M18 16h20l8 8v24a4 4 0 0 1-4 4H18a4 4 0 0 1-4-4V20a4 4 0 0 1 4-4z' fill='none' stroke='%23fbbf24' stroke-width='4'/%3E%3Cpath d='M38 16v8h8' fill='none' stroke='%23fbbf24' stroke-width='4'/%3E%3C/svg%3E">
<style>
  :root { --bg:#f3f4f6; --card:#fff; --text:#111827; --muted:#6b7280; --line:#e5e7eb; --ok:#047857; --danger:#b91c1c; --warn:#b45309; }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif; }
  body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  header { background:#1f2937; color:#fff; padding:8px 14px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
  header h1 { margin:0; font-size:16px; }
  header .tools { display:flex; gap:6px; align-items:center; }
  header a, header button { background:#374151; color:#fff; border:none; border-radius:10px; height:36px; padding:0 10px; font-size:14px; font-weight:800; text-decoration:none; display:inline-flex; align-items:center; cursor:pointer; }
  header button { width:38px; justify-content:center; font-size:18px; }
  main { max-width:560px; margin:0 auto; padding:10px 12px 28px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px 12px; margin-bottom:10px; }
  label.f { display:block; font-size:12px; color:var(--muted); font-weight:700; margin:6px 0 3px; }
  input, select { width:100%; font-size:16px; padding:8px 10px; border:2px solid var(--line); border-radius:10px; background:#fff; color:var(--text); }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .photo { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .photo button, .act, .mini { border:none; border-radius:12px; font-weight:800; cursor:pointer; }
  .photo button { background:#1f2937; color:#fff; padding:12px 14px; font-size:15px; flex:1; min-width:132px; }
  .photo button.lib { background:#2563eb; }
  .photo img { width:72px; height:72px; object-fit:cover; border-radius:10px; border:1px solid var(--line); display:none; }
  .photo img.show { display:block; }
  .act { width:100%; padding:14px; font-size:17px; color:#fff; background:#047857; margin-top:8px; }
  .act.secondary { background:#1d4ed8; }
  .act:disabled { opacity:.55; }
  .status { min-height:18px; font-size:13px; color:var(--muted); margin:6px 2px; }
  .status.err { color:var(--danger); font-weight:700; }
  .status.ok { color:var(--ok); font-weight:700; }
  .line { border:1px solid var(--line); border-radius:12px; padding:8px; margin-bottom:8px; background:#fafafa; }
  .line.bad { border-color:#fca5a5; background:#fff7f7; }
  .line .top { display:flex; justify-content:space-between; align-items:center; gap:6px; }
  .line .raw { font-size:12px; color:var(--muted); }
  .mini { background:#fee2e2; color:var(--danger); padding:6px 8px; font-size:13px; }
  .mini.add { background:#e5e7eb; color:var(--text); padding:8px 12px; }
  .row3 { display:grid; grid-template-columns:1.3fr .8fr .7fr; gap:6px; margin-top:6px; }
  .total { font-size:16px; font-weight:900; text-align:left; }
  details { background:var(--card); border:1px solid var(--line); border-radius:14px; margin-top:12px; }
  summary { padding:12px 14px; font-weight:800; cursor:pointer; }
  .sent li { display:flex; justify-content:space-between; gap:8px; padding:8px 14px; border-top:1px solid var(--line); font-size:14px; }
  .sent ul { list-style:none; margin:0; padding:0 0 6px; }
  dialog { border:none; border-radius:16px; padding:0; width:min(440px, 94vw); }
  dialog::backdrop { background:rgba(0,0,0,.45); }
  .dlg { padding:14px 16px 16px; }
  .dlg h2 { margin:0 0 8px; font-size:17px; }
  .dlg p { color:var(--muted); font-size:13px; }
  .dlg .row { display:flex; gap:8px; margin-top:10px; }
  .dlg .row button { flex:1; border:none; border-radius:10px; padding:11px; font-weight:800; cursor:pointer; }
  .check { display:flex; align-items:center; gap:8px; margin-top:8px; font-size:14px; }
  .check input { width:auto; }
</style>
</head>
<body>
<header>
  <h1>תעודת קליטה</h1>
  <div class="tools">
    <a href="index.html">קרטונים</a>
    <button id="settings" type="button" aria-label="הגדרות">⚙</button>
  </div>
</header>
<main>
  <section class="card">
    <label class="f" for="supplier">ספק</label>
    <select id="supplier"></select>
    <div class="grid2">
      <div><label class="f" for="date">תאריך</label><input id="date" type="date"></div>
      <div><label class="f" for="arrival">תאריך הגעה</label><input id="arrival" type="date"></div>
    </div>
    <label class="f" for="docno">מס' מסמך ספק (לא חובה)</label>
    <input id="docno" type="text" inputmode="numeric" autocomplete="off">
  </section>

  <section class="card">
    <div class="photo">
      <button id="pick-cam" type="button">צלם עכשיו</button>
      <button id="pick-lib" class="lib" type="button">העלה תמונה</button>
      <img id="preview" alt="צילום הפתק">
      <input id="file-cam" type="file" accept="image/*" capture="environment" hidden>
      <input id="file-lib" type="file" accept="image/*" hidden>
    </div>
    <button class="act secondary" id="parse" type="button">פענח עם Gemini</button>
    <p class="status" id="status"></p>
    <p class="status" id="notes"></p>
  </section>

  <section class="card">
    <div class="top" style="display:flex;justify-content:space-between;align-items:center">
      <strong>שורות</strong>
      <button class="mini add" id="add-line" type="button">+ שורה</button>
    </div>
    <div id="lines" style="margin-top:8px"></div>
    <div class="total" id="total"></div>
  </section>

  <section class="card">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <strong>הובלה</strong>
      <button class="mini add" id="add-pkg" type="button">+ אריזה</button>
    </div>
    <div id="packages" style="margin-top:8px"></div>
  </section>

  <button class="act" id="save" type="button">שמור תעודה</button>
  <p class="status" id="save-status"></p>

  <details class="sent" open>
    <summary>תעודות שנשלחו</summary>
    <ul id="sent"></ul>
  </details>
</main>

<dialog id="dlg">
  <div class="dlg">
    <h2>הגדרות</h2>
    <p>מפתח Gemini חינמי מ-<span dir="ltr">aistudio.google.com/apikey</span>. נשמר רק בטלפון.</p>
    <label class="f">מפתח Gemini</label>
    <input id="gkey" type="password" autocomplete="off" placeholder="AIza...">
    <label class="f">מודל</label>
    <input id="gmodel" type="text" dir="ltr" autocomplete="off">
    <label class="f">טוקן GitHub (אותו טוקן של דף הקרטונים)</label>
    <input id="gtoken" type="password" autocomplete="off" placeholder="github_pat_...">
    <label class="check"><input id="gphoto" type="checkbox" checked> צרף את הצילום לתעודה</label>
    <p>הצילום נשמר עד שהתוכנה במחשב קולטת את התעודה. אם הטוקן מוגדר גם במחשב, הצילום נמחק אחר כך.</p>
    <div class="row">
      <button id="cfg-save" type="button" style="background:#1f2937;color:#fff">שמור</button>
      <button id="cfg-close" type="button" style="background:#e5e7eb">סגור</button>
    </div>
    <p class="status" id="cfg-msg"></p>
  </div>
</dialog>

<script>
(function () {
  var DATA = JSON.parse(document.getElementById('data').textContent);
  var LS = { token: 'omer_gh_token', gkey: 'intake_gemini_key', model: 'intake_gemini_model', photo: 'intake_attach_photo', queue: 'intake_queue', sent: 'intake_sent' };
  var API = 'https://api.github.com/repos/' + DATA.repo + '/contents/';
  var RAW = 'https://raw.githubusercontent.com/' + DATA.repo + '/' + DATA.branch + '/';

  function lsGet(k, d) { try { var v = localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
  function today() { var d = new Date(), p = function (n) { return String(n).padStart(2, '0'); }; return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()); }
  function nowStamp() {
    var d = new Date(), p = function (n) { return String(n).padStart(2, '0'); };
    return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '_' + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds());
  }
  function nowStr() { return today() + ' ' + new Date().toTimeString().slice(0, 5); }
  function b64utf8(str) { return btoa(unescape(encodeURIComponent(str))); }

  var state = {
    token: lsGet(LS.token, ''), gemini: lsGet(LS.gkey, ''), model: lsGet(LS.model, '') || DATA.defaultModel,
    attach: lsGet(LS.photo, '1') !== '0',
    imageB64: '', lines: [], packages: [], notes: '', queue: [], sent: []
  };
  try { state.queue = JSON.parse(lsGet(LS.queue, '[]')) || []; } catch (e) { state.queue = []; }
  try { state.sent = JSON.parse(lsGet(LS.sent, '[]')) || []; } catch (e) { state.sent = []; }

  var byName = {};
  DATA.products.forEach(function (p) { byName[p.name] = p; });

  function norm(s) {
    return String(s || '').replace(/["'׳״.,]/g, ' ').replace(/מ\.?\s*ג/g, 'בגד גוף').replace(/ש\.א/g, 'שרוול ארוך').replace(/ש\.ק/g, 'שרוול קצר').replace(/[-–/]/g, ' ').replace(/\s+/g, ' ').trim();
  }
  function matchProduct(raw) {
    var n = norm(raw);
    if (!n) return '';
    var best = '', score = 0;
    DATA.products.forEach(function (p) {
      var pn = norm(p.name), s = 0;
      if (n === pn) s = 2000 + pn.length;
      else if (pn && n.indexOf(pn) >= 0) s = 1000 + pn.length;
      (p.aliases || []).forEach(function (a) {
        var an = norm(a);
        if (an && (n === an || n.indexOf(an) >= 0)) s = Math.max(s, 1000 + an.length);
      });
      if (s > score) { score = s; best = p.name; }
    });
    return score >= 1000 ? best : '';
  }
  function normSize(size) {
    return String(size || '').trim().replace(/\s+/g, '').replace(/[\/–]/g, '-');
  }
  function productOf(name) { return byName[name] || null; }
  function sizesOf(name) { var p = productOf(name); return p ? p.sizes.slice() : []; }
  function setStatus(id, text, cls) { var el = document.getElementById(id); el.textContent = text || ''; el.className = 'status' + (cls ? ' ' + cls : ''); }

  // ----- form header
  var supplier = document.getElementById('supplier');
  DATA.suppliers.forEach(function (s) {
    var o = document.createElement('option'); o.value = String(s.id); o.textContent = s.name; supplier.appendChild(o);
  });
  if (DATA.defaultSupplierId != null) supplier.value = String(DATA.defaultSupplierId);
  document.getElementById('date').value = today();
  document.getElementById('arrival').value = today();

  function supplierName() {
    var id = supplier.value;
    var s = DATA.suppliers.filter(function (x) { return String(x.id) === id; })[0];
    return s ? s.name : '';
  }

  // ----- photo
  // Two inputs on purpose: capture opens the camera only. The second input
  // has no capture attribute, so the phone offers the gallery and files
  // (including a picture already saved from WhatsApp).
  function onPhoto(input) {
    var file = input.files && input.files[0];
    input.value = '';
    if (!file) return;
    resize(file).then(function (dataUrl) {
      state.imageB64 = dataUrl.split(',')[1] || '';
      var img = document.getElementById('preview');
      img.src = dataUrl; img.classList.add('show');
      setStatus('status', 'התמונה מוכנה. אפשר לפענח.');
    }).catch(function (err) {
      setStatus('status', err.message || 'התמונה לא נקראה', 'err');
    });
  }
  document.getElementById('pick-cam').addEventListener('click', function () { document.getElementById('file-cam').click(); });
  document.getElementById('pick-lib').addEventListener('click', function () { document.getElementById('file-lib').click(); });
  document.getElementById('file-cam').addEventListener('change', function () { onPhoto(this); });
  document.getElementById('file-lib').addEventListener('change', function () { onPhoto(this); });
  function resize(file) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      var url = URL.createObjectURL(file);
      img.onload = function () {
        var max = 1600, w = img.width, h = img.height;
        var scale = Math.min(1, max / Math.max(w, h));
        w = Math.round(w * scale); h = Math.round(h * scale);
        var c = document.createElement('canvas'); c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('התמונה לא נקראה')); };
      img.src = url;
    });
  }

  // ----- gemini
  function promptText() {
    var lines = DATA.products.map(function (p) {
      return '- ' + p.name + ' | מידות: ' + (p.sizes.join(', ') || 'ללא') + (p.aliases.length ? ' | גם: ' + p.aliases.join(', ') : '');
    }).join('\n');
    return [
      'אתה קורא פתק כתב יד בעברית של קבלת סחורה ממפעל תפירה (בגדי תינוקות).',
      'כל קבוצה בפתק היא מוצר אחד עם כמה מידות. כל מידה היא שורה נפרדת, והמספר שכתוב מתחת למידה הוא הכמות ביחידות.',
      'מידות נכתבות 0-3, 3-6, 6-12, 12-18, 18-24, 24-30 או מידות ילדים (2, 4, 6, 8, 10, S, M, L). "12/18" = "12-18".',
      'מילון: מ.ג/מג = בגד גוף. ש.א = שרוול ארוך. ש.ק = שרוול קצר. גופ\' אמריקאית / בייבי אמריקאי יחד עם גטקס = הסט "סט גטקס + בייבי אמריקאי שרוול ארוך". סאות/סטים = סט. רגליות + בגד גוף ארוך = "סט בייבי בייסיק רגליות + בגד גוף ארוך".',
      'שקים / שק / שקית / בד הם אריזת הובלה ולא שורת מוצר. שים אותם ב-packages (type הוא "שק" או "שקית קטנה" או "בד", quantity הוא מספר האריזות).',
      'product חייב להיות אחד השמות מהרשימה, או מחרוזת ריקה אם לא בטוח. size אחד מהמידות של אותו מוצר.',
      'color רק אם הצבע כתוב (לבן, צבעוני, מודפס, אפור, ורוד, כחול, תכלת, שמנת), אחרת ריק.',
      'raw = מה שקראת בפתק. confidence בין 0 ל-1. notes = מה שלא שובץ.',
      'רשימת המוצרים:', lines
    ].join('\n');
  }
  function schema() {
    return {
      type: 'object',
      properties: {
        lines: { type: 'array', items: { type: 'object', properties: {
          raw: { type: 'string' }, product: { type: 'string' }, size: { type: 'string' },
          quantity: { type: 'integer' }, color: { type: 'string' }, confidence: { type: 'number' }
        }, required: ['raw', 'product', 'size', 'quantity'] } },
        packages: { type: 'array', items: { type: 'object', properties: {
          type: { type: 'string' }, quantity: { type: 'integer' }
        }, required: ['type', 'quantity'] } },
        notes: { type: 'string' }
      },
      required: ['lines', 'packages', 'notes']
    };
  }
  function geminiBody(useNewFormat) {
    var gen = { temperature: 0.1 };
    if (useNewFormat) {
      gen.responseFormat = { text: { mimeType: 'APPLICATION_JSON', schema: schema() } };
    } else {
      gen.responseMimeType = 'application/json';
      gen.responseJsonSchema = schema();
    }
    return {
      contents: [{ parts: [
        { inline_data: { mime_type: 'image/jpeg', data: state.imageB64 } },
        { text: promptText() }
      ] }],
      generationConfig: gen
    };
  }
  function callGemini(useNewFormat) {
    return fetch('https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(state.model) + ':generateContent', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-goog-api-key': state.gemini },
      body: JSON.stringify(geminiBody(useNewFormat))
    }).then(function (r) {
      return r.json().then(function (body) {
        if (!r.ok) {
          var msg = (body && body.error && body.error.message) || ('Gemini ' + r.status);
          var err = new Error(msg); err.status = r.status; throw err;
        }
        return body;
      });
    });
  }
  document.getElementById('parse').addEventListener('click', function () {
    if (!state.imageB64) { setStatus('status', 'קודם מצלמים או בוחרים תמונה', 'err'); return; }
    if (!state.gemini) { setStatus('status', 'חסר מפתח Gemini — פתח את גלגל השיניים', 'err'); openDlg(); return; }
    setStatus('status', 'קורא את הפתק…');
    document.getElementById('parse').disabled = true;
    callGemini(true).catch(function (e) {
      if (e && e.status === 400) return callGemini(false);
      throw e;
    }).then(function (body) {
      var parts = (((body.candidates || [])[0] || {}).content || {}).parts || [];
      var text = parts.map(function (p) { return p.text || ''; }).join('');
      text = text.replace(/^```json\s*/i, '').replace(/```$/, '').trim();
      var parsed = JSON.parse(text);
      applyParsed(parsed);
      setStatus('status', 'נמצאו ' + state.lines.length + ' שורות. בדוק ותקן לפני השמירה.', 'ok');
    }).catch(function (e) {
      setStatus('status', 'הפענוח נכשל: ' + (e.message || e), 'err');
    }).then(function () { document.getElementById('parse').disabled = false; });
  });

  function applyParsed(parsed) {
    var driver = (DATA.drivers || [])[0] || '';
    state.notes = parsed.notes || '';
    document.getElementById('notes').textContent = state.notes ? ('לא שובץ: ' + state.notes) : '';
    state.lines = (parsed.lines || []).map(function (l) {
      var product = byName[l.product] ? l.product : matchProduct(l.product || l.raw || '');
      var size = normSize(l.size);
      var sizes = sizesOf(product);
      if (sizes.length && sizes.indexOf(size) < 0) {
        var loose = sizes.filter(function (s) { return normSize(s) === size; })[0];
        if (loose) size = loose;
      }
      return { raw: l.raw || '', product: product, size: size, quantity: parseInt(l.quantity, 10) || 0, color: l.color || '', confidence: l.confidence || 0, label: 'עם תווית' };
    });
    state.packages = (parsed.packages || []).map(function (p) {
      var type = PACKAGE_FIX[norm(p.type)] || (DATA.packageTypes.indexOf(p.type) >= 0 ? p.type : 'שק');
      return { type: type, quantity: parseInt(p.quantity, 10) || 0, driver: driver };
    }).filter(function (p) { return p.quantity > 0; });
    renderLines(); renderPackages();
  }
  var PACKAGE_FIX = { 'שק': 'שק', 'שקים': 'שק', 'שקית': 'שקית קטנה', 'שקית קטנה': 'שקית קטנה', 'בד': 'בד' };

  // ----- lines
  function blankLine() { return { raw: '', product: '', size: '', quantity: 0, color: '', confidence: 1, label: 'עם תווית' }; }
  function renderLines() {
    var box = document.getElementById('lines');
    box.innerHTML = '';
    if (!state.lines.length) box.innerHTML = '<p class="raw">אין שורות עדיין. פענח תמונה או הוסף שורה.</p>';
    state.lines.forEach(function (line, i) { box.appendChild(lineCard(line, i)); });
    renderTotal();
  }
  function lineCard(line, i) {
    var card = document.createElement('div');
    var known = !!productOf(line.product);
    var sizes = sizesOf(line.product);
    var sizeOk = !sizes.length || sizes.indexOf(line.size) >= 0;
    card.className = 'line' + ((!known || !line.quantity || !sizeOk) ? ' bad' : '');
    var prodOpts = '<option value="">— בחר מוצר —</option>' + DATA.products.map(function (p) {
      return '<option value="' + esc(p.name) + '"' + (p.name === line.product ? ' selected' : '') + '>' + esc(p.name) + '</option>';
    }).join('');
    var sizeOpts = sizes.map(function (s) { return '<option' + (s === line.size ? ' selected' : '') + '>' + esc(s) + '</option>'; }).join('');
    if (line.size && sizes.indexOf(line.size) < 0) sizeOpts = '<option selected>' + esc(line.size) + '</option>' + sizeOpts;
    var colorOpts = '<option value=""></option>' + DATA.colors.map(function (c) {
      return '<option' + (c === line.color ? ' selected' : '') + '>' + esc(c) + '</option>';
    }).join('');
    card.innerHTML =
      '<div class="top"><span class="raw">' + esc(line.raw || ('שורה ' + (i + 1))) + '</span><button class="mini" type="button" data-del="' + i + '">מחק</button></div>' +
      '<label class="f">מוצר</label><select data-field="product">' + prodOpts + '</select>' +
      '<div class="row3">' +
        '<div><label class="f">מידה</label><select data-field="size">' + sizeOpts + '</select></div>' +
        '<div><label class="f">כמות</label><input data-field="quantity" type="number" inputmode="numeric" min="0" value="' + (line.quantity || '') + '"></div>' +
        '<div><label class="f">צבע</label><select data-field="color">' + colorOpts + '</select></div>' +
      '</div>';
    card.querySelector('[data-del]').addEventListener('click', function () { state.lines.splice(i, 1); renderLines(); });
    card.querySelector('[data-field="product"]').addEventListener('change', function (e) {
      line.product = e.target.value;
      var s = sizesOf(line.product);
      if (s.length && s.indexOf(line.size) < 0) line.size = s[0] || '';
      var def = (productOf(line.product) || {}).defaults || {};
      if (!line.color && def.fabric_color) line.color = def.fabric_color;
      renderLines();
    });
    card.querySelector('[data-field="size"]').addEventListener('change', function (e) { line.size = e.target.value; renderLines(); });
    card.querySelector('[data-field="color"]').addEventListener('change', function (e) { line.color = e.target.value; });
    var qty = card.querySelector('[data-field="quantity"]');
    qty.addEventListener('input', function () { line.quantity = parseInt(qty.value, 10) || 0; renderTotal(); });
    return card;
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  function renderPackages() {
    var box = document.getElementById('packages');
    box.innerHTML = '';
    if (!state.packages.length) box.innerHTML = '<p class="raw">בלי פריטי הובלה.</p>';
    state.packages.forEach(function (pkg, i) {
      var card = document.createElement('div');
      card.className = 'line';
      var types = DATA.packageTypes.map(function (t) { return '<option' + (t === pkg.type ? ' selected' : '') + '>' + esc(t) + '</option>'; }).join('');
      var drivers = (DATA.drivers || []).map(function (d) { return '<option' + (d === pkg.driver ? ' selected' : '') + '>' + esc(d) + '</option>'; }).join('');
      card.innerHTML = '<div class="row3">' +
        '<div><label class="f">סוג</label><select data-f="type">' + types + '</select></div>' +
        '<div><label class="f">כמות</label><input data-f="quantity" type="number" min="0" value="' + (pkg.quantity || '') + '"></div>' +
        '<div><label class="f">מוביל</label><select data-f="driver">' + drivers + '</select></div></div>' +
        '<button class="mini" type="button" style="margin-top:6px">מחק</button>';
      card.querySelector('[data-f="type"]').addEventListener('change', function (e) { pkg.type = e.target.value; });
      card.querySelector('[data-f="quantity"]').addEventListener('input', function (e) { pkg.quantity = parseInt(e.target.value, 10) || 0; });
      card.querySelector('[data-f="driver"]').addEventListener('change', function (e) { pkg.driver = e.target.value; });
      card.querySelector('.mini').addEventListener('click', function () { state.packages.splice(i, 1); renderPackages(); });
      box.appendChild(card);
    });
  }
  function renderTotal() {
    var qty = state.lines.reduce(function (a, l) { return a + (parseInt(l.quantity, 10) || 0); }, 0);
    var bad = state.lines.filter(function (l) { return !productOf(l.product) || !l.size || !l.quantity; }).length;
    document.getElementById('total').textContent = 'סה"כ ' + qty.toLocaleString() + ' יח\'' + (bad ? ' · ' + bad + ' שורות לתיקון' : '');
  }
  document.getElementById('add-line').addEventListener('click', function () { state.lines.push(blankLine()); renderLines(); });
  document.getElementById('add-pkg').addEventListener('click', function () {
    state.packages.push({ type: 'שק', quantity: 1, driver: (DATA.drivers || [])[0] || '' });
    renderPackages();
  });

  // ----- save
  function buildRecord() {
    var id = nowStamp() + '_' + Math.random().toString(36).slice(2, 6);
    var lines = state.lines.filter(function (l) { return l.product && l.size && l.quantity; }).map(function (l) {
      return { product: l.product, size: l.size, quantity: parseInt(l.quantity, 10) || 0, fabric_color: l.color || '', label_status: l.label || 'עם תווית', note: l.raw || '' };
    });
    var packages = state.packages.filter(function (p) { return p.type && p.quantity; }).map(function (p) {
      return { package_type: p.type, quantity: parseInt(p.quantity, 10) || 0, driver: p.driver || '' };
    });
    return {
      record: {
        id: id, supplier_id: parseInt(supplier.value, 10) || null, supplier: supplierName(),
        date: document.getElementById('date').value, arrival_date: document.getElementById('arrival').value,
        supplier_doc_number: (document.getElementById('docno').value || '').trim(),
        lines: lines, packages: packages, notes: state.notes,
        image: state.attach && state.imageB64 ? ('intakes/images/' + id + '.jpg') : '',
        created_at: nowStr(), source: 'phone'
      },
      imageB64: state.attach ? state.imageB64 : ''
    };
  }
  function ghHeaders() { return { 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28', 'Authorization': 'Bearer ' + state.token }; }
  function ghPut(path, b64, message) {
    return fetch(API + path, { method: 'PUT', headers: ghHeaders(), body: JSON.stringify({ message: message, content: b64, branch: DATA.branch }) })
      .then(function (r) { if (!r.ok) return r.text().then(function (t) { throw new Error('GitHub ' + r.status + ' ' + t.slice(0, 140)); }); return r.json(); });
  }
  function uploadOne(item) {
    var rec = item.record, id = rec.id;
    return ghPut('intakes/pending/' + id + '.json', b64utf8(JSON.stringify(rec, null, 1)), 'Phone intake ' + id).then(function () {
      if (item.imageB64 && rec.image) return ghPut(rec.image, item.imageB64, 'Phone intake photo ' + id);
    });
  }
  function flush() {
    if (!state.token || !state.queue.length || !navigator.onLine) return Promise.resolve();
    var next = state.queue[0];
    return uploadOne(next).then(function () {
      state.queue.shift(); lsSet(LS.queue, JSON.stringify(state.queue));
      markSent(next.record, 'pending');
      return flush();
    }).catch(function (e) { setStatus('save-status', 'ממתין לסנכרון: ' + (e.message || e), 'err'); });
  }
  function markSent(rec, status) {
    var total = rec.lines.reduce(function (a, l) { return a + (l.quantity || 0); }, 0);
    state.sent = state.sent.filter(function (s) { return s.id !== rec.id; });
    state.sent.unshift({ id: rec.id, supplier: rec.supplier, date: rec.date, total: total, status: status, intakeId: null });
    state.sent = state.sent.slice(0, 30);
    lsSet(LS.sent, JSON.stringify(state.sent));
    renderSent();
  }
  document.getElementById('save').addEventListener('click', function () {
    var bad = state.lines.filter(function (l) { return !productOf(l.product) || !l.size || !l.quantity; });
    var good = state.lines.filter(function (l) { return productOf(l.product) && l.size && l.quantity; });
    if (!good.length) { setStatus('save-status', 'אין שורות תקינות לשמירה', 'err'); return; }
    if (bad.length && !confirm(bad.length + ' שורות לא תקינות ולא יישמרו. להמשיך?')) return;
    if (!supplier.value) { setStatus('save-status', 'בחר ספק', 'err'); return; }
    var item = buildRecord();
    if (!state.token) {
      state.queue.push(item);
      if (!lsSet(LS.queue, JSON.stringify(state.queue))) state.queue.pop();
      if (state.queue.indexOf(item) < 0) { setStatus('save-status', 'השמירה בטלפון נכשלה (הזיכרון מלא)', 'err'); return; }
      markSent(item.record, 'queued');
      setStatus('save-status', 'נשמר בטלפון. חסר טוקן GitHub — יישלח אחרי שתזין אותו בהגדרות.', 'err');
      return;
    }
    setStatus('save-status', 'שומר…');
    document.getElementById('save').disabled = true;
    uploadOne(item).then(function () {
      markSent(item.record, 'pending');
      setStatus('save-status', 'נשמר. התעודה תיקלט בתוכנה במחשב.', 'ok');
      state.lines = []; state.packages = []; state.notes = ''; state.imageB64 = '';
      document.getElementById('preview').classList.remove('show');
      document.getElementById('notes').textContent = '';
      renderLines(); renderPackages();
    }).catch(function (e) {
      state.queue.push(item); lsSet(LS.queue, JSON.stringify(state.queue));
      markSent(item.record, 'queued');
      setStatus('save-status', 'לא נשלח (' + (e.message || e) + '). נשמר בטלפון ויישלח שוב.', 'err');
    }).then(function () { document.getElementById('save').disabled = false; });
  });

  function renderSent() {
    var ul = document.getElementById('sent');
    if (!state.sent.length) { ul.innerHTML = '<li class="raw">עדיין אין</li>'; return; }
    var label = { pending: 'ממתין לקליטה', queued: 'ממתין לשליחה', done: 'נקלט' };
    ul.innerHTML = state.sent.map(function (s) {
      var st = s.status === 'done' && s.intakeId ? ('נקלט #' + s.intakeId) : (label[s.status] || s.status);
      return '<li><span>' + esc(s.date) + ' · ' + esc(s.supplier) + ' · ' + (s.total || 0) + ' יח\'</span><span>' + esc(st) + '</span></li>';
    }).join('');
  }
  function refreshSentStatus() {
    var pending = state.sent.filter(function (s) { return s.status === 'pending'; });
    var jobs = pending.map(function (s) {
      return fetch(RAW + 'intakes/done/' + s.id + '.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) {
        if (!r.ok) return null;
        return r.json().then(function (j) { s.status = 'done'; s.intakeId = j.imported_id || null; });
      }).catch(function () { return null; });
    });
    return Promise.all(jobs).then(function () { lsSet(LS.sent, JSON.stringify(state.sent)); renderSent(); });
  }

  // ----- settings
  var dlg = document.getElementById('dlg');
  function openDlg() {
    document.getElementById('gkey').value = state.gemini;
    document.getElementById('gmodel').value = state.model;
    document.getElementById('gtoken').value = state.token;
    document.getElementById('gphoto').checked = state.attach;
    document.getElementById('cfg-msg').textContent = state.queue.length ? (state.queue.length + ' תעודות ממתינות לשליחה') : '';
    if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', '');
  }
  document.getElementById('settings').addEventListener('click', openDlg);
  document.getElementById('cfg-close').addEventListener('click', function () { if (dlg.close) dlg.close(); });
  document.getElementById('cfg-save').addEventListener('click', function () {
    state.gemini = document.getElementById('gkey').value.trim();
    state.model = document.getElementById('gmodel').value.trim() || DATA.defaultModel;
    state.token = document.getElementById('gtoken').value.trim();
    state.attach = document.getElementById('gphoto').checked;
    lsSet(LS.gkey, state.gemini); lsSet(LS.model, state.model);
    if (state.token) lsSet(LS.token, state.token); else try { localStorage.removeItem(LS.token); } catch (e) {}
    lsSet(LS.photo, state.attach ? '1' : '0');
    document.getElementById('cfg-msg').textContent = 'נשמר';
    flush();
  });

  renderLines(); renderPackages(); renderSent();
  refreshSentStatus();
  window.addEventListener('online', flush);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { refreshSentStatus(); flush(); } });
  flush();
})();
</script>
</body>
</html>
